name: road

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MEASUREMENTS_SCHEMA: ${MEASUREMENTS_SCHEMA}
      PROCESSED_SCHEMA: ${PROCESSED_SCHEMA}
      INGESTOR_PG_USER: ${INGESTOR_PG_USER}
      INGESTOR_PG_PASSWORD: ${INGESTOR_PG_PASSWORD}
      PROCESSOR_PG_USER: ${PROCESSOR_PG_USER}
      PROCESSOR_PG_PASSWORD: ${PROCESSOR_PG_PASSWORD}
    volumes:
      - ./db/users-creation.sh:/docker-entrypoint-initdb.d/init.sh:Z
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${INGESTOR_PG_USER}:${INGESTOR_PG_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MEASUREMENTS_SCHEMA: ${MEASUREMENTS_SCHEMA}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


  # Start a fake atmotube to test the api. Uncomment only if debugging.
  #atmotube-sim:
  #  build: ./atmotube-sim
  #  restart: unless-stopped
  #  environment:
  #    API_URL: http://api:8000/measurements
  #    API_KEY: ${API_KEY}
  #    PYTHONUNBUFFERED: 1
  #  depends_on:
  #    - api

  processor:
    build: ./processor
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://${PROCESSOR_PG_USER}:${PROCESSOR_PG_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PROCESSED_SCHEMA: ${PROCESSED_SCHEMA}
      PROCESSOR_MAX_CONCURRENT_JOBS: ${PROCESSOR_MAX_CONCURRENT_JOBS}
      PORT: 8000
    volumes:
      - ${PROCESSOR_OUTPUT_DIR}:/app/output:Z,U
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kong-migration:
    image: kong
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "postgres"
      KONG_PG_PORT: "5432"
      KONG_PG_DATABASE: "${POSTGRES_DB}"
      KONG_PG_USER: "${KONG_DB_USER}"
      KONG_PG_PASSWORD: "${KONG_DB_PASSWORD}"
      KONG_PG_SCHEMA: "${KONG_DB_SCHEMA}"
    command: sh -c "kong migrations bootstrap"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kong:
    image: kong
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "postgres"
      KONG_PG_PORT: "5432"
      KONG_PG_DATABASE: "${POSTGRES_DB}"
      KONG_PG_USER: "${KONG_DB_USER}"
      KONG_PG_PASSWORD: "${KONG_DB_PASSWORD}"
      KONG_PG_SCHEMA: "${KONG_DB_SCHEMA}"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001" # Enables Admin API internally
    ports:
      - "8000:8000"  # Public proxy port
      - "127.0.0.1:8001:8001"  # Admin API port (keep internal or secure in production)
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:Z
    command: sh -c "kong config db_import /etc/kong/kong.yml && kong start"
    depends_on:
      postgres:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
